name: Seed Ring Promoter

# After CI passes on main, seed Ring Promoter (app "thaivisaexperts", ring prod)
# with the commit SHA. RP dispatches pages.yml and waits until
# https://thaivisaexperts.com/version.json reports that SHA.
#
# The prod ring requires the RP production password. CI does not hold it, so
# RP answers 403 and this job ends with an "awaiting production approval"
# summary; a human then seeds prod in the RP UI with the password.
#
# If RP_API_TOKEN is not set, or the app is not registered in Ring Promoter yet
# (HTTP 404), this falls back to dispatching pages.yml directly so a green main
# still goes live.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Commit SHA to deploy. Default: current main."
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: seed-ring-promoter
  cancel-in-progress: false

jobs:
  seed:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Seed Ring Promoter and wait for a healthy deploy
        env:
          RP_API_TOKEN: ${{ secrets.RP_API_TOKEN }}
          RP_URL: ${{ secrets.RP_URL }}
          VERSION: ${{ inputs.VERSION || github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RP="${RP_URL:-https://rp.workstation.co.uk}"
          APP=thaivisaexperts

          fallback() {
            echo "::warning::$1 Dispatching pages.yml directly."
            gh workflow run pages.yml --ref main -f ENV=prod -f DEPLOY_BRANCH="${VERSION}" -f DEPLOY_MODE=full
            exit 0
          }

          [ -n "${RP_API_TOKEN:-}" ] || fallback "RP_API_TOKEN is not set."

          echo "Seeding ${APP} prod @ ${VERSION} — track: ${RP}/?app=${APP}"
          code=$(curl -sS -o /tmp/seed.out -w '%{http_code}' \
            -X POST "${RP}/api/apps/${APP}/seed?async=1" \
            -H "Authorization: Bearer ${RP_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(printf '{"ring":"prod","version":"%s"}' "$VERSION")" || echo 000)
          echo "seed -> HTTP ${code} :: $(cat /tmp/seed.out 2>/dev/null)"
          case "${code}" in
            200|202) ;;
            404) fallback "${APP} is not registered in Ring Promoter." ;;
            # The prod ring is password-gated on purpose (RP_PROD_PASSWORD): a
            # human approves each production deploy in the Ring Promoter UI.
            403)
              echo "::notice::Production is gated. Approve ${VERSION} in ${RP}/?app=${APP} (Seed → ring prod → enter the production password)."
              echo "### Awaiting production approval" >> "$GITHUB_STEP_SUMMARY"
              echo "Deploy \`${VERSION}\` from [Ring Promoter](${RP}/?app=${APP}): seed ring **prod** and enter the production password." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            *) echo "::error::Ring Promoter seed failed (HTTP ${code})"; exit 1 ;;
          esac

          JOB_ID=$(python3 -c 'import json; print(json.load(open("/tmp/seed.out")).get("job_id") or "")')
          [ -n "$JOB_ID" ] || { echo "::error::seed response had no job_id"; exit 1; }

          python3 - "$RP" "$RP_API_TOKEN" "$APP" "$JOB_ID" "$VERSION" <<'PY'
          import json, sys, time, urllib.error, urllib.request

          rp, token, app, job_id, version = sys.argv[1:6]
          url = f"{rp}/api/apps/{app}/jobs/{job_id}"
          deadline = time.time() + 40 * 60
          last = None

          def dump_logs(body):
              for step in body.get("steps") or []:
                  print(f"--- step {step.get('id')} status={step.get('status')} ---")
                  for line in step.get("logs") or []:
                      print(line)

          while time.time() < deadline:
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = json.load(resp)
              except urllib.error.HTTPError as e:
                  print(f"::warning::job poll HTTP {e.code}")
                  time.sleep(15)
                  continue
              status = (body.get("status") or "").lower()
              if status != last:
                  print(f"RP job {job_id} status={status}")
                  last = status
              if status == "success":
                  dump_logs(body)
                  if (body.get("result") or {}).get("success") is False:
                      print("::error::RP job marked success but result.success is false")
                      sys.exit(1)
                  print(f"thaivisaexperts.com is live at {version}")
                  sys.exit(0)
              if status in ("failed", "failure", "error"):
                  dump_logs(body)
                  print(f"::error::Ring Promoter deploy failed: {(body.get('result') or {}).get('message') or status}")
                  sys.exit(1)
              time.sleep(15)
          print("::error::timed out waiting for Ring Promoter job")
          sys.exit(1)
          PY
