name: DNS (thaivisaexperts.com)

# Keeps Cloudflare in line with deploy/dns/thaivisaexperts.com.records.
# Idempotent: re-running is a no-op; a changed target updates the record in place.
on:
  push:
    branches: [main]
    paths:
      - deploy/dns/**
      - scripts/cloudflare-dns.sh
      - .github/workflows/dns.yml
  workflow_dispatch:
    inputs:
      DRY_RUN:
        type: boolean
        description: "Print the intended records without changing Cloudflare"
        default: false

permissions:
  contents: read

concurrency:
  group: dns-thaivisaexperts
  cancel-in-progress: false

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upsert records
        env:
          # Scoped token: Zone:DNS:Edit (+ Zone:Read if CLOUDFLARE_ZONE_ID is unset)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE: thaivisaexperts.com
          DRY_RUN: ${{ inputs.DRY_RUN || false }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN}" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          [ -n "${CLOUDFLARE_ZONE_ID}" ] || unset CLOUDFLARE_ZONE_ID
          extra=""; [ "$DRY_RUN" = "true" ] && extra="--dry-run"
          grep -vE '^\s*(#|$)' deploy/dns/thaivisaexperts.com.records | while read -r name type content proxied; do
            echo "::group::${name} ${type} ${content} (proxied=${proxied})"
            ./scripts/cloudflare-dns.sh --name "$name" --type "$type" --content "$content" --proxied "$proxied" $extra
            echo "::endgroup::"
          done
