name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Content tests fail if any locale is missing a message key, visa, guide or page,
      # or if docs/CONTENT-TODO.md / docs/TRANSLATION-TODO.md are out of date.
      - name: Unit & content tests
        run: pnpm test
      - name: Build static site
        run: pnpm build
      - name: Install Playwright
        run: pnpm --filter @tve/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @tve/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
